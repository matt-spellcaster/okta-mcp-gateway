# Change-management and vulnerability controls for this repository.
# Each job runs one check, records the result as JSON evidence, and fails if the
# check fails. The final job bundles all evidence with SHA-256 hashes and, on
# main, signs the bundle with a GitHub artifact attestation (Sigstore).
name: Compliance

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "41 6 * * 1" # weekly, so new CVEs and rule changes are caught without a commit
  workflow_dispatch:

permissions: {} # every job asks for exactly what it needs

concurrency:
  group: compliance-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.15"
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb" # linux_x64 tarball
  PIP_AUDIT_VERSION: "2.10.1"
  ZIZMOR_VERSION: "1.30.1"

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: Run tests
        run: |
          mkdir -p results
          set +e
          uv run --frozen pytest -q --junitxml=results/tests-junit.xml
          code=$?
          passed=$(grep -o 'tests="[0-9]*"' results/tests-junit.xml | head -1 | tr -dc 0-9)
          python3 scripts/ci/record.py tests "$code" --title "Tests" \
            --control "SOC 2 CC8.1" --control "ISO 27001 A.8.29" \
            --tool "pytest (uv ${UV_VERSION})" \
            --detail "${passed:-0} tests covering the audit interceptor, the hash chain and reconciliation"
          exit "$code"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: result-tests
          path: results/
          retention-days: 7

  image-build:
    name: Image build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the server image and check it runs unprivileged
        run: |
          mkdir -p results
          set +e
          docker build -t okta-mcp-gateway:ci image
          code=$?
          if [ "$code" -eq 0 ]; then
            # The container has no OS keyring; the server would crash without the in-memory one.
            docker run --rm --entrypoint python okta-mcp-gateway:ci -c "
          import keyring, okta_mcp_server
          keyring.set_password('s', 'u', 't')
          assert keyring.get_password('s', 'u') == 't', 'keyring backend not usable'
          "
            code=$?
            uid=$(docker run --rm --entrypoint id okta-mcp-gateway:ci -u)
            [ "$uid" = "0" ] && { echo "image runs as root"; code=1; }
          fi
          digest=$(docker image inspect okta-mcp-gateway:ci --format '{{.Id}}' 2>/dev/null)
          python3 scripts/ci/record.py image-build "$code" --title "Image build" \
            --control "SOC 2 CC8.1" --control "ISO 27001 A.8.19" \
            --tool "docker build" \
            --detail "pinned base and hashed requirements; runs as uid ${uid:-unknown}; ${digest:-no image}"
          exit "$code"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: result-image-build
          path: results/
          retention-days: 7

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan the whole history, not just this commit
          persist-credentials: false
      - name: Install gitleaks (checksum verified)
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum --check --strict
          tar -xzf "$tarball" gitleaks
      - name: Scan git history for secrets
        run: |
          mkdir -p results
          set +e
          ./gitleaks git --redact --no-banner --report-format json \
            --report-path results/secret-scan.json .
          code=$?
          leaks=$(python3 -c "import json; print(len(json.load(open('results/secret-scan.json'))))" 2>/dev/null)
          commits=$(git rev-list --count HEAD)
          python3 scripts/ci/record.py secret-scan "$code" --title "Secret scan" \
            --control "SOC 2 CC6.1" --control "ISO 27001 A.8.12" \
            --tool "gitleaks ${GITLEAKS_VERSION}" \
            --detail "${leaks:-unknown} leaks in ${commits} commits (values redacted)"
          exit "$code"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: result-secret-scan
          path: results/
          retention-days: 7

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: Audit the image requirements and the dev lockfile
        run: |
          mkdir -p results
          set +e
          # What actually reaches Okta: the hashed requirements installed in the image.
          uvx "pip-audit@${PIP_AUDIT_VERSION}" -r image/requirements.txt --require-hashes --disable-pip \
            --format json -o results/dependency-audit.json
          code=$?
          uv lock --check
          lock=$?
          [ "$code" -eq 0 ] && code=$lock
          summary=$(python3 -c "
          import json
          r = json.load(open('results/dependency-audit.json'))
          deps = r['dependencies']
          vulns = sum(len(d.get('vulns', [])) for d in deps)
          print(f'{vulns} known vulnerabilities in {len(deps)} pinned packages')
          " 2>/dev/null)
          [ "$lock" -ne 0 ] && summary="uv.lock is out of date. ${summary}"
          python3 scripts/ci/record.py dependency-audit "$code" --title "Dependency audit" \
            --control "SOC 2 CC7.1" --control "ISO 27001 A.8.8" \
            --tool "pip-audit ${PIP_AUDIT_VERSION}" --detail "${summary:-audit did not complete}"
          exit "$code"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: result-dependency-audit
          path: results/
          retention-days: 7

  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: Check workflows for security issues
        run: |
          mkdir -p results
          set +e
          uvx "zizmor@${ZIZMOR_VERSION}" --offline --format json .github/workflows > results/workflow-lint.json
          code=$?
          issues=$(python3 -c "import json; print(len(json.load(open('results/workflow-lint.json'))))" 2>/dev/null)
          python3 scripts/ci/record.py workflow-lint "$code" --title "Workflow lint" \
            --control "SOC 2 CC8.1" --control "ISO 27001 A.8.9" \
            --tool "zizmor ${ZIZMOR_VERSION}" \
            --detail "${issues:-unknown} issues (pinned actions, token permissions, injection, credential persistence)"
          exit "$code"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: result-workflow-lint
          path: results/
          retention-days: 7

  branch-rules:
    name: Branch rules
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check branch protection on the default branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set +e
          python3 scripts/ci/check_branch_rules.py --branch "$DEFAULT_BRANCH" --out results/branch-rules.json
          code=$?
          python3 scripts/ci/record.py branch-rules "$code" --title "Branch rules" \
            --control "SOC 2 CC8.1" --control "ISO 27001 A.8.32" \
            --tool "GitHub rulesets API" \
            --detail "${DEFAULT_BRANCH}: pull requests, required checks, no force pushes or deletion"
          exit "$code"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: result-branch-rules
          path: results/
          retention-days: 7

  evidence:
    name: Evidence
    needs: [tests, image-build, secret-scan, dependency-audit, workflow-lint, branch-rules]
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # to sign the attestation (Sigstore)
      attestations: write # to store it on GitHub
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: result-*
          path: results
      - name: Build the evidence bundle
        run: |
          set +e
          python3 scripts/ci/build_evidence.py results evidence \
            --expect tests --expect image-build --expect secret-scan \
            --expect dependency-audit --expect workflow-lint --expect branch-rules
          echo "code=$?" >> "$GITHUB_ENV"
          tar -czf "evidence-${GITHUB_SHA}.tar.gz" evidence
      - name: Sign the evidence bundle
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: evidence-${{ github.sha }}.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compliance-evidence-${{ github.sha }}
          path: evidence-${{ github.sha }}.tar.gz
          retention-days: 90
      - name: Fail if any check failed
        run: exit "${code:-1}"
